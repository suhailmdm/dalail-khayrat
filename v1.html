<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dalail al-Khayrat – Hizb Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300..700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
/* ─── TOKENS ──────────────────────────────────────────────── */
:root,[data-theme="light"]{
  --color-bg:#f7f6f2;--color-surface:#f9f8f5;--color-surface-2:#fbfbf9;
  --color-surface-offset:#f3f0ec;--color-surface-dynamic:#e6e4df;
  --color-divider:#dcd9d5;--color-border:#d4d1ca;
  --color-text:#28251d;--color-text-muted:#7a7974;--color-text-faint:#bab9b4;
  --color-primary:#01696f;--color-primary-hover:#0c4e54;
  --color-primary-highlight:#cedcd8;
  --color-gold:#c4870a;--color-gold-soft:#f5e9cc;
  --color-success:#437a22;--color-success-soft:#d4dfcc;
  --color-orange:#964219;--color-orange-soft:#ddcfc6;
  --color-shadow: 0 2px 8px oklch(0.2 0.01 80/0.08), 0 1px 2px oklch(0.2 0.01 80/0.05);
  --radius-sm:.375rem;--radius-md:.5rem;--radius-lg:.75rem;--radius-xl:1rem;--radius-full:9999px;
  --font-body:'DM Sans',system-ui,sans-serif;--font-arabic:'Amiri',serif;
  --text-xs:clamp(.75rem,.7rem + .25vw,.875rem);
  --text-sm:clamp(.875rem,.8rem + .35vw,1rem);
  --text-base:clamp(1rem,.95rem + .25vw,1.125rem);
  --text-lg:clamp(1.125rem,1rem + .75vw,1.5rem);
  --text-xl:clamp(1.5rem,1.2rem + 1.25vw,2.25rem);
  --space-1:.25rem;--space-2:.5rem;--space-3:.75rem;--space-4:1rem;
  --space-5:1.25rem;--space-6:1.5rem;--space-8:2rem;--space-10:2.5rem;
  --space-12:3rem;--space-16:4rem;
  --transition:180ms cubic-bezier(.16,1,.3,1);
}
[data-theme="dark"]{
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
  --color-divider:#262523;--color-border:#393836;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
  --color-gold:#e8af34;--color-gold-soft:#3a3020;
  --color-success:#6daa45;--color-success-soft:#2a3520;
  --color-orange:#bb653b;--color-orange-soft:#3a2820;
  --color-shadow:0 2px 8px oklch(0 0 0/.25),0 1px 2px oklch(0 0 0/.2);
}
@media(prefers-color-scheme:dark){:root:not([data-theme]){
  --color-bg:#171614;--color-surface:#1c1b19;--color-surface-2:#201f1d;
  --color-surface-offset:#1d1c1a;--color-surface-dynamic:#2d2c2a;
  --color-divider:#262523;--color-border:#393836;
  --color-text:#cdccca;--color-text-muted:#797876;--color-text-faint:#5a5957;
  --color-primary:#4f98a3;--color-primary-hover:#227f8b;
  --color-primary-highlight:#313b3b;
  --color-gold:#e8af34;--color-gold-soft:#3a3020;
  --color-success:#6daa45;--color-success-soft:#2a3520;
  --color-orange:#bb653b;--color-orange-soft:#3a2820;
  --color-shadow:0 2px 8px oklch(0 0 0/.25),0 1px 2px oklch(0 0 0/.2);
}}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;scroll-behavior:smooth;}
body{min-height:100dvh;font-family:var(--font-body);font-size:var(--text-base);color:var(--color-text);background:var(--color-bg);}
img,svg{display:block;}
button{cursor:pointer;background:none;border:none;font:inherit;color:inherit;}
input,select{font:inherit;color:inherit;}
a,button,[role="button"]{transition:color var(--transition),background var(--transition),border-color var(--transition),box-shadow var(--transition);}

/* ─── LAYOUT ──────────────────────────────────────────────── */
.app{display:grid;grid-template-columns:260px 1fr;grid-template-rows:auto 1fr;min-height:100dvh;}
@media(max-width:900px){.app{grid-template-columns:1fr;}}
.sidebar{grid-row:1/-1;background:var(--color-surface);border-right:1px solid var(--color-border);padding:var(--space-6) var(--space-4);display:flex;flex-direction:column;gap:var(--space-4);}
@media(max-width:900px){.sidebar{grid-row:auto;border-right:none;border-bottom:1px solid var(--color-border);padding:var(--space-4);}}
.topbar{background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:var(--space-3) var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);}
.main{padding:var(--space-6) var(--space-8);overflow:auto;}
@media(max-width:768px){.main{padding:var(--space-4);}}

/* ─── LOGO / BRAND ─────────────────────────────────────────── */
.brand{display:flex;align-items:center;gap:var(--space-3);padding-bottom:var(--space-4);border-bottom:1px solid var(--color-border);}
.brand-icon{width:38px;height:38px;flex-shrink:0;}
.brand-title{font-size:var(--text-sm);font-weight:700;line-height:1.3;letter-spacing:-.01em;}
.brand-sub{font-size:var(--text-xs);color:var(--color-text-muted);}

/* ─── NAV ──────────────────────────────────────────────────── */
.nav-section{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--color-text-faint);font-weight:600;margin-bottom:var(--space-2);}
.nav-item{display:flex;align-items:center;gap:var(--space-3);padding:var(--space-2) var(--space-3);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--color-text-muted);cursor:pointer;border:none;background:none;width:100%;text-align:left;transition:background var(--transition),color var(--transition);}
.nav-item:hover{background:var(--color-surface-offset);color:var(--color-text);}
.nav-item.active{background:var(--color-primary-highlight);color:var(--color-primary);font-weight:600;}
.nav-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--color-text-faint);}
.nav-item.active .nav-dot{background:var(--color-primary);}

/* ─── READER LIST (sidebar) ────────────────────────────────── */
.reader-list{flex:1;overflow:auto;}
.reader-chip{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-radius:var(--radius-full);font-size:var(--text-xs);background:var(--color-surface-offset);color:var(--color-text-muted);margin-bottom:var(--space-2);}
.reader-chip .dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.reader-chip.fixed .dot{background:var(--color-primary);}
.reader-chip.floating .dot{background:var(--color-gold);}
.badge{font-size:var(--text-xs);padding:1px var(--space-2);border-radius:var(--radius-full);font-weight:600;margin-left:auto;}
.badge.fixed{background:var(--color-primary-highlight);color:var(--color-primary);}
.badge.floating{background:var(--color-gold-soft);color:var(--color-gold);}

/* ─── TOPBAR ───────────────────────────────────────────────── */
.page-title{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em;}
.topbar-actions{display:flex;align-items:center;gap:var(--space-3);}
.btn{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);font-weight:500;cursor:pointer;border:1px solid transparent;transition:background var(--transition),color var(--transition),border-color var(--transition);}
.btn-primary{background:var(--color-primary);color:#fff;}
.btn-primary:hover{background:var(--color-primary-hover);}
.btn-ghost{background:none;border-color:var(--color-border);color:var(--color-text-muted);}
.btn-ghost:hover{background:var(--color-surface-offset);color:var(--color-text);}
.theme-toggle{width:36px;height:36px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);color:var(--color-text-muted);border:1px solid var(--color-border);}
.theme-toggle:hover{background:var(--color-surface-offset);color:var(--color-text);}

/* ─── WEEK NAV ─────────────────────────────────────────────── */
.week-nav{display:flex;align-items:center;gap:var(--space-3);margin-bottom:var(--space-6);}
.week-label{font-size:var(--text-base);font-weight:600;flex:1;}
.week-badge{font-size:var(--text-xs);padding:2px var(--space-2);border-radius:var(--radius-full);background:var(--color-gold-soft);color:var(--color-gold);font-weight:600;}
.icon-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:var(--radius-md);border:1px solid var(--color-border);color:var(--color-text-muted);flex-shrink:0;}
.icon-btn:hover{background:var(--color-surface-offset);color:var(--color-text);}

/* ─── SCHEDULE GRID ────────────────────────────────────────── */
.schedule-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--space-3);}
@media(max-width:900px){.schedule-grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:500px){.schedule-grid{grid-template-columns:repeat(2,1fr);}}
.day-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);display:flex;flex-direction:column;gap:var(--space-3);min-height:170px;box-shadow:var(--color-shadow);transition:box-shadow var(--transition);}
.day-card:hover{box-shadow:0 4px 16px oklch(0.2 0.01 80/.12);}
.day-card.today{border-color:var(--color-primary);background:color-mix(in oklch,var(--color-primary) 4%,var(--color-surface));}
.day-card.wednesday{border-color:var(--color-gold);}
.day-header{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-2);}
.day-name{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.07em;font-weight:600;color:var(--color-text-muted);}
.day-date{font-size:var(--text-xl);font-weight:700;letter-spacing:-.03em;line-height:1;color:var(--color-text);}
.day-card.today .day-date{color:var(--color-primary);}
.day-pill{font-size:var(--text-xs);padding:2px var(--space-2);border-radius:var(--radius-full);font-weight:600;}
.today-pill{background:var(--color-primary);color:#fff;}
.wed-pill{background:var(--color-gold-soft);color:var(--color-gold);}
.hizb-list{display:flex;flex-direction:column;gap:var(--space-2);flex:1;}
.hizb-item{border-radius:var(--radius-md);padding:var(--space-2) var(--space-3);display:flex;flex-direction:column;gap:2px;}
.hizb-item.fixed-reader{background:var(--color-primary-highlight);}
.hizb-item.floating-reader{background:var(--color-gold-soft);}
.hizb-number{font-size:var(--text-xs);font-weight:700;color:var(--color-text-muted);}
.hizb-item.fixed-reader .hizb-number{color:var(--color-primary);}
.hizb-item.floating-reader .hizb-number{color:var(--color-gold);}
.hizb-reader{font-size:var(--text-xs);color:var(--color-text);font-weight:500;}
.hizb-arabic{font-family:var(--font-arabic);font-size:var(--text-sm);color:var(--color-text-muted);direction:rtl;text-align:right;line-height:1.8;}
.empty-day{font-size:var(--text-xs);color:var(--color-text-faint);text-align:center;margin-top:auto;padding-bottom:var(--space-2);}

/* ─── READER TABLE ─────────────────────────────────────────── */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-4);}
.section-title{font-size:var(--text-lg);font-weight:700;letter-spacing:-.02em;}
.card-wrap{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);overflow:hidden;box-shadow:var(--color-shadow);}
table{width:100%;border-collapse:collapse;}
thead{background:var(--color-surface-offset);}
th{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--color-text-muted);padding:var(--space-3) var(--space-4);text-align:left;border-bottom:1px solid var(--color-border);}
td{font-size:var(--text-sm);padding:var(--space-3) var(--space-4);border-bottom:1px solid oklch(from var(--color-text) l c h/.06);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:var(--color-surface-offset);}
.type-badge{display:inline-flex;align-items:center;gap:var(--space-2);padding:2px var(--space-3);border-radius:var(--radius-full);font-size:var(--text-xs);font-weight:600;}
.type-badge.fixed{background:var(--color-primary-highlight);color:var(--color-primary);}
.type-badge.floating{background:var(--color-gold-soft);color:var(--color-gold);}
.hizb-tag{display:inline-flex;align-items:center;padding:2px var(--space-2);border-radius:var(--radius-sm);font-size:var(--text-xs);font-weight:600;background:var(--color-surface-dynamic);color:var(--color-text-muted);}
.hizb-tag.fixed{background:var(--color-primary-highlight);color:var(--color-primary);}
.hizb-tag.floating{background:var(--color-gold-soft);color:var(--color-gold);}

/* ─── STATS ROW ────────────────────────────────────────────── */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--space-4);margin-bottom:var(--space-6);}
@media(max-width:700px){.stats-row{grid-template-columns:repeat(2,1fr);}}
.stat-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);box-shadow:var(--color-shadow);}
.stat-label{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.07em;color:var(--color-text-muted);font-weight:600;margin-bottom:var(--space-1);}
.stat-value{font-size:var(--text-xl);font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums lining-nums;}
.stat-sub{font-size:var(--text-xs);color:var(--color-text-muted);margin-top:2px;}
.stat-accent-primary .stat-value{color:var(--color-primary);}
.stat-accent-gold .stat-value{color:var(--color-gold);}
.stat-accent-success .stat-value{color:var(--color-success);}
.stat-accent-orange .stat-value{color:var(--color-orange);}

/* ─── VIEW TABS ────────────────────────────────────────────── */
.view-tabs{display:flex;gap:var(--space-1);background:var(--color-surface-offset);padding:3px;border-radius:var(--radius-md);border:1px solid var(--color-border);}
.view-tab{padding:var(--space-1) var(--space-4);border-radius:calc(var(--radius-md) - 2px);font-size:var(--text-sm);font-weight:500;cursor:pointer;color:var(--color-text-muted);transition:background var(--transition),color var(--transition);}
.view-tab.active{background:var(--color-surface);color:var(--color-text);box-shadow:var(--color-shadow);}
.view-tab:hover:not(.active){color:var(--color-text);}

/* ─── MODAL ─────────────────────────────────────────────────── */
.modal-overlay{position:fixed;inset:0;background:oklch(0 0 0/.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:var(--space-4);}
.modal-overlay.hidden{display:none;}
.modal{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-6);width:100%;max-width:480px;box-shadow:0 16px 48px oklch(0 0 0/.3);}
.modal-title{font-size:var(--text-lg);font-weight:700;margin-bottom:var(--space-4);}
.form-group{display:flex;flex-direction:column;gap:var(--space-2);margin-bottom:var(--space-4);}
label{font-size:var(--text-sm);font-weight:600;color:var(--color-text-muted);}
input,select{padding:var(--space-2) var(--space-3);border:1px solid var(--color-border);border-radius:var(--radius-md);background:var(--color-surface-2);font-size:var(--text-sm);color:var(--color-text);transition:border-color var(--transition);}
input:focus,select:focus{outline:none;border-color:var(--color-primary);}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-3);}
.modal-actions{display:flex;gap:var(--space-3);justify-content:flex-end;margin-top:var(--space-2);}

/* ─── HIDDEN SECTIONS ─────────────────────────────────────── */
.view-section{display:none;}
.view-section.active{display:block;}

/* ─── ARABIC HEADER ORNAMENT ─────────────────────────────── */
.arabic-ornament{font-family:var(--font-arabic);font-size:var(--text-lg);color:var(--color-text-faint);letter-spacing:.05em;}
</style>
</head>
<body>

<div class="app" id="app">
<!-- ════ SIDEBAR ════ -->
<aside class="sidebar">
  <div class="brand">
    <svg class="brand-icon" viewBox="0 0 38 38" fill="none" aria-label="Dalail al-Khayrat logo">
      <rect width="38" height="38" rx="10" fill="currentColor" style="color:var(--color-primary-highlight)"/>
      <path d="M19 7 C12 7 8 12 8 19 C8 26 12 31 19 31 C26 31 30 26 30 19 C30 12 26 7 19 7Z" stroke="var(--color-primary)" stroke-width="1.5" fill="none"/>
      <path d="M19 11 L19 27 M13 19 L25 19" stroke="var(--color-primary)" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="19" cy="19" r="2.5" fill="var(--color-primary)"/>
    </svg>
    <div>
      <div class="brand-title">Dalāʾil al-Khayrāt</div>
      <div class="brand-sub arabic-ornament">دَلَائِل الخَيْرَات</div>
    </div>
  </div>

  <div>
    <div class="nav-section">Navigation</div>
    <button class="nav-item active" onclick="switchView('schedule')">
      <div class="nav-dot"></div> Weekly Schedule
    </button>
    <button class="nav-item" onclick="switchView('readers')">
      <div class="nav-dot"></div> Readers
    </button>
    <button class="nav-item" onclick="switchView('progress')">
      <div class="nav-dot"></div> Progress Tracker
    </button>
  </div>

  <div class="reader-list">
    <div class="nav-section">Readers</div>
    <div id="sidebar-readers"></div>
  </div>

  <div style="margin-top:auto;padding-top:var(--space-4);border-top:1px solid var(--color-border);">
    <div style="font-size:var(--text-xs);color:var(--color-text-faint);text-align:center;font-family:var(--font-arabic);font-size:1rem;direction:rtl;">اللَّهُمَّ صَلِّ عَلَى مُحَمَّد</div>
  </div>
</aside>

<!-- ════ TOPBAR ════ -->
<header class="topbar">
  <div class="page-title" id="page-title">Weekly Schedule</div>
  <div class="topbar-actions">
    <button class="btn btn-primary" onclick="openModal()">+ Assign Hizb</button>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle theme">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </div>
</header>

<!-- ════ MAIN ════ -->
<main class="main">

  <!-- ── SCHEDULE VIEW ── -->
  <section id="view-schedule" class="view-section active">
    <div class="stats-row" id="stats-row"></div>
    <div class="week-nav">
      <button class="icon-btn" onclick="changeWeek(-1)" aria-label="Previous week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="week-label" id="week-label"></div>
      <span class="week-badge" id="week-badge"></span>
      <button class="icon-btn" onclick="changeWeek(1)" aria-label="Next week">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </div>
    <div class="schedule-grid" id="schedule-grid"></div>
  </section>

  <!-- ── READERS VIEW ── -->
  <section id="view-readers" class="view-section">
    <div class="section-header">
      <div class="section-title">All Readers</div>
      <button class="btn btn-ghost" onclick="openReaderModal()">+ Add Reader</button>
    </div>
    <div class="card-wrap">
      <table><thead><tr>
        <th>Name</th><th>Type</th><th>Default Hizb</th><th>Today's Hizb</th><th>Total Read</th>
      </tr></thead>
      <tbody id="readers-table"></tbody></table>
    </div>
  </section>

  <!-- ── PROGRESS VIEW ── -->
  <section id="view-progress" class="view-section">
    <div class="section-header">
      <div class="section-title">Hizb Progress</div>
      <div class="view-tabs">
        <button class="view-tab active" onclick="filterProgress('all',this)">All</button>
        <button class="view-tab" onclick="filterProgress('assigned',this)">Assigned</button>
        <button class="view-tab" onclick="filterProgress('unassigned',this)">Unassigned</button>
      </div>
    </div>
    <div class="card-wrap">
      <table><thead><tr>
        <th>Hizb #</th><th>Section Name</th><th>Arabic</th><th>Assigned To</th><th>Day</th>
      </tr></thead>
      <tbody id="progress-table"></tbody></table>
    </div>
  </section>
</main>
</div>

<!-- ════ ASSIGN HIZB MODAL ════ -->
<div class="modal-overlay hidden" id="assign-modal">
  <div class="modal">
    <div class="modal-title">Assign Hizb</div>
    <div class="form-row">
      <div class="form-group">
        <label>Reader</label>
        <select id="modal-reader"></select>
      </div>
      <div class="form-group">
        <label>Day</label>
        <select id="modal-day">
          <option value="0">Sunday</option>
          <option value="1">Monday</option>
          <option value="2">Tuesday</option>
          <option value="3">Wednesday</option>
          <option value="4">Thursday</option>
          <option value="5">Friday</option>
          <option value="6">Saturday</option>
        </select>
      </div>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Hizb Number</label>
        <select id="modal-hizb"></select>
      </div>
      <div class="form-group">
        <label>Week Offset</label>
        <select id="modal-week">
          <option value="0">This week</option>
          <option value="1">Next week</option>
          <option value="-1">Last week</option>
        </select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('assign-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveAssignment()">Assign</button>
    </div>
  </div>
</div>

<!-- ════ ADD READER MODAL ════ -->
<div class="modal-overlay hidden" id="reader-modal">
  <div class="modal">
    <div class="modal-title">Add Reader</div>
    <div class="form-group">
      <label>Name</label>
      <input type="text" id="reader-name" placeholder="e.g. Suhail">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Type</label>
        <select id="reader-type">
          <option value="fixed">Fixed</option>
          <option value="floating">Floating</option>
        </select>
      </div>
      <div class="form-group">
        <label>Default Hizb</label>
        <select id="reader-default-hizb"></select>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal('reader-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="saveReader()">Add Reader</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════
// DATA — seed data, edit freely
// ══════════════════════════════════════════════════
const DAYS = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const DAY_FULL = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];

// Dalail al-Khayrat has 12 ahzab (sections). Wednesday = 2 ahzab.
const HIZB_NAMES = [
  {n:1, ar:'الجزء الأول', en:'Section I'},
  {n:2, ar:'الجزء الثاني', en:'Section II'},
  {n:3, ar:'الجزء الثالث', en:'Section III'},
  {n:4, ar:'الجزء الرابع', en:'Section IV'},
  {n:5, ar:'الجزء الخامس', en:'Section V'},
  {n:6, ar:'الجزء السادس', en:'Section VI'},
  {n:7, ar:'الجزء السابع', en:'Section VII'},
  {n:8, ar:'الجزء الثامن', en:'Section VIII'},
  {n:9, ar:'الجزء التاسع', en:'Section IX'},
  {n:10,ar:'الجزء العاشر', en:'Section X'},
  {n:11,ar:'الجزء الحادي عشر', en:'Section XI'},
  {n:12,ar:'الجزء الثاني عشر', en:'Section XII'},
];

// State
let readers = [
  {id:1, name:'Suhail',   type:'fixed',    defaultHizb:1},
  {id:2, name:'Abdullah', type:'fixed',    defaultHizb:2},
  {id:3, name:'Hamza',    type:'fixed',    defaultHizb:3},
  {id:4, name:'Bilal',    type:'floating', defaultHizb:null},
  {id:5, name:'Yaseen',   type:'floating', defaultHizb:null},
  {id:6, name:'Omar',     type:'fixed',    defaultHizb:4},
  {id:7, name:'Ibrahim',  type:'floating', defaultHizb:null},
];

// assignments: {weekKey: {day: [{readerId, hizbN}]}}
let assignments = {};
let weekOffset = 0;
let nextReaderId = 8;

// ── WEEK HELPERS ────────────────────────────────────────────
function getWeekStart(offset=0){
  const d = new Date();
  const day = d.getDay();
  d.setDate(d.getDate() - day + offset*7);
  d.setHours(0,0,0,0);
  return d;
}
function weekKey(offset=0){
  const d = getWeekStart(offset);
  return d.toISOString().slice(0,10);
}
function getDayDate(dayIndex,offset=0){
  const ws = getWeekStart(offset);
  const d = new Date(ws);
  d.setDate(d.getDate()+dayIndex);
  return d;
}
function isToday(dayIndex,offset=0){
  const d = getDayDate(dayIndex,offset);
  const t = new Date(); t.setHours(0,0,0,0);
  return d.getTime()===t.getTime();
}
function formatDate(d){return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});}

// ── SEED DEFAULT ASSIGNMENTS ─────────────────────────────────
function seedDefaults(){
  const wk = weekKey(weekOffset);
  if(!assignments[wk]) assignments[wk]={};
  // Mon=1: fixed readers default hizbaat
  // Wed=3: 2 hizbaat
  // Fri=5: floating readers fill in
  const dayMap = {1:[{rId:1,h:1},{rId:2,h:2}],3:[{rId:3,h:3},{rId:6,h:4},{rId:4,h:5},{rId:5,h:6}],5:[{rId:7,h:7}]};
  Object.entries(dayMap).forEach(([day,arr])=>{
    if(!assignments[wk][day]) assignments[wk][day]=[];
    arr.forEach(a=>{
      if(!assignments[wk][day].find(x=>x.readerId===a.rId))
        assignments[wk][day].push({readerId:a.rId,hizbN:a.h});
    });
  });
}

// ── VIEWS ────────────────────────────────────────────────────
let currentView='schedule';
function switchView(v){
  currentView=v;
  document.querySelectorAll('.view-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  event.currentTarget.classList.add('active');
  const titles={schedule:'Weekly Schedule',readers:'All Readers',progress:'Hizb Progress'};
  document.getElementById('page-title').textContent=titles[v];
  renderAll();
}

// ── RENDER ────────────────────────────────────────────────────
function renderAll(){
  seedDefaults();
  renderSidebar();
  renderStats();
  renderSchedule();
  renderReadersTable();
  renderProgressTable('all');
}

function renderSidebar(){
  const el=document.getElementById('sidebar-readers');
  el.innerHTML=readers.map(r=>`
    <div class="reader-chip ${r.type}">
      <div class="dot"></div>
      <span>${r.name}</span>
      <span class="badge ${r.type}">${r.type==='fixed'?'Fixed':'Float'}</span>
    </div>`).join('');
}

function renderStats(){
  const wk=weekKey(weekOffset);
  const asgn=assignments[wk]||{};
  const totalAssigned=Object.values(asgn).reduce((s,arr)=>s+arr.length,0);
  const fixedCount=readers.filter(r=>r.type==='fixed').length;
  const floatCount=readers.filter(r=>r.type==='floating').length;
  const hizbDone=new Set(Object.values(asgn).flat().map(a=>a.hizbN)).size;
  document.getElementById('stats-row').innerHTML=`
    <div class="stat-card stat-accent-primary">
      <div class="stat-label">This Week</div>
      <div class="stat-value">${totalAssigned}</div>
      <div class="stat-sub">Hizb assignments</div>
    </div>
    <div class="stat-card stat-accent-gold">
      <div class="stat-label">Unique Ahzab</div>
      <div class="stat-value">${hizbDone}</div>
      <div class="stat-sub">of 12 covered</div>
    </div>
    <div class="stat-card stat-accent-success">
      <div class="stat-label">Fixed Readers</div>
      <div class="stat-value">${fixedCount}</div>
      <div class="stat-sub">Regular members</div>
    </div>
    <div class="stat-card stat-accent-orange">
      <div class="stat-label">Floating Readers</div>
      <div class="stat-value">${floatCount}</div>
      <div class="stat-sub">Flexible members</div>
    </div>`;
}

function renderSchedule(){
  const wk=weekKey(weekOffset);
  const asgn=assignments[wk]||{};
  const ws=getWeekStart(weekOffset);
  const we=new Date(ws); we.setDate(we.getDate()+6);
  document.getElementById('week-label').textContent=`Week of ${formatDate(ws)} – ${formatDate(we)}`;
  const isWed=d=>d.getDay()===3;
  document.getElementById('week-badge').textContent=`Week ${Math.ceil((ws.getDate())/7)} · ${ws.getFullYear()}`;

  document.getElementById('schedule-grid').innerHTML=DAYS.map((d,i)=>{
    const date=getDayDate(i,weekOffset);
    const today=isToday(i,weekOffset);
    const wed=(i===3);
    const dayAsgn=(asgn[i]||[]);
    const items=dayAsgn.map(a=>{
      const r=readers.find(x=>x.id===a.readerId);
      const h=HIZB_NAMES[a.hizbN-1];
      const type=r?r.type:'fixed';
      return `<div class="hizb-item ${type}-reader">
        <div class="hizb-number">Hizb ${a.hizbN}</div>
        <div class="hizb-reader">${r?r.name:'—'}</div>
        <div class="hizb-arabic">${h?h.ar:''}</div>
      </div>`;
    }).join('');
    return `<div class="day-card${today?' today':''}${wed?' wednesday':''}">
      <div class="day-header">
        <div>
          <div class="day-name">${d}</div>
          <div class="day-date">${date.getDate()}</div>
        </div>
        ${today?'<span class="day-pill today-pill">Today</span>':''}
        ${wed&&!today?'<span class="day-pill wed-pill">×2</span>':''}
      </div>
      <div class="hizb-list">${items||'<div class="empty-day">No reading</div>'}</div>
    </div>`;
  }).join('');
}

function renderReadersTable(){
  const wk=weekKey(weekOffset);
  const asgn=assignments[wk]||{};
  const todayDay=new Date().getDay();
  const todayAsgn=(asgn[todayDay]||[]);
  document.getElementById('readers-table').innerHTML=readers.map(r=>{
    const ta=todayAsgn.find(a=>a.readerId===r.id);
    const total=Object.values(assignments).reduce((s,week)=>
      s+Object.values(week).reduce((ss,arr)=>ss+arr.filter(a=>a.readerId===r.id).length,0),0);
    return `<tr>
      <td><strong>${r.name}</strong></td>
      <td><span class="type-badge ${r.type}">${r.type==='fixed'?'Fixed':'Floating'}</span></td>
      <td>${r.defaultHizb?`<span class="hizb-tag ${r.type}">Hizb ${r.defaultHizb}</span>`:'<span style="color:var(--color-text-faint)">Varies</span>'}</td>
      <td>${ta?`<span class="hizb-tag ${r.type}">Hizb ${ta.hizbN}</span>`:'<span style="color:var(--color-text-faint)">Not assigned</span>'}</td>
      <td><strong style="font-variant-numeric:tabular-nums">${total}</strong></td>
    </tr>`;
  }).join('');
}

function renderProgressTable(filter='all'){
  const wk=weekKey(weekOffset);
  const asgn=assignments[wk]||{};
  const allAssigned=[];
  Object.entries(asgn).forEach(([day,arr])=>arr.forEach(a=>allAssigned.push({...a,day:parseInt(day)})));

  document.getElementById('progress-table').innerHTML=HIZB_NAMES.map(h=>{
    const match=allAssigned.filter(a=>a.hizbN===h.n);
    const assigned=match.length>0;
    if(filter==='assigned'&&!assigned) return '';
    if(filter==='unassigned'&&assigned) return '';
    const readers_str=match.map(a=>{
      const r=readers.find(x=>x.id===a.readerId);
      return r?`<span class="hizb-tag ${r.type}">${r.name}</span>`:''}).join(' ');
    const days_str=[...new Set(match.map(a=>DAYS[a.day]))].join(', ')||'—';
    return `<tr>
      <td><strong style="font-variant-numeric:tabular-nums">Hizb ${h.n}</strong></td>
      <td>${h.en}</td>
      <td style="font-family:var(--font-arabic);direction:rtl;font-size:var(--text-base)">${h.ar}</td>
      <td>${assigned?readers_str:'<span style="color:var(--color-text-faint)">Unassigned</span>'}</td>
      <td style="color:var(--color-text-muted);font-size:var(--text-xs)">${days_str}</td>
    </tr>`;
  }).join('');
}
window.filterProgress=function(f,btn){
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderProgressTable(f);
};

// ── WEEK NAV ─────────────────────────────────────────────────
window.changeWeek=function(d){weekOffset+=d;renderAll();};

// ── MODALS ────────────────────────────────────────────────────
function populateSelects(){
  const rs=document.querySelectorAll('#modal-reader,#readers-table + * #modal-reader');
  ['modal-reader','reader-default-hizb'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    if(id==='modal-reader'){
      el.innerHTML=readers.map(r=>`<option value="${r.id}">${r.name}</option>`).join('');
    } else {
      el.innerHTML='<option value="">None</option>'+HIZB_NAMES.map(h=>`<option value="${h.n}">Hizb ${h.n}</option>`).join('');
    }
  });
  const mh=document.getElementById('modal-hizb');
  if(mh) mh.innerHTML=HIZB_NAMES.map(h=>`<option value="${h.n}">Hizb ${h.n} – ${h.en}</option>`).join('');
}

window.openModal=function(){
  populateSelects();
  document.getElementById('assign-modal').classList.remove('hidden');
};
window.openReaderModal=function(){
  populateSelects();
  document.getElementById('reader-modal').classList.remove('hidden');
};
window.closeModal=function(id){document.getElementById(id).classList.add('hidden');};
document.querySelectorAll('.modal-overlay').forEach(o=>o.addEventListener('click',e=>{if(e.target===o)o.classList.add('hidden');}));

window.saveAssignment=function(){
  const rId=parseInt(document.getElementById('modal-reader').value);
  const day=parseInt(document.getElementById('modal-day').value);
  const hizbN=parseInt(document.getElementById('modal-hizb').value);
  const wo=parseInt(document.getElementById('modal-week').value);
  const wk=weekKey(wo);
  if(!assignments[wk]) assignments[wk]={};
  if(!assignments[wk][day]) assignments[wk][day]=[];
  if(!assignments[wk][day].find(a=>a.readerId===rId&&a.hizbN===hizbN))
    assignments[wk][day].push({readerId:rId,hizbN});
  closeModal('assign-modal');
  renderAll();
};

window.saveReader=function(){
  const name=document.getElementById('reader-name').value.trim();
  const type=document.getElementById('reader-type').value;
  const dh=document.getElementById('reader-default-hizb').value;
  if(!name)return;
  readers.push({id:nextReaderId++,name,type,defaultHizb:dh?parseInt(dh):null});
  closeModal('reader-modal');
  renderAll();
};

// ── THEME TOGGLE ─────────────────────────────────────────────
(function(){
  const t=document.querySelector('[data-theme-toggle]');
  const r=document.documentElement;
  let d=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';
  r.setAttribute('data-theme',d);
  if(t){
    t.addEventListener('click',()=>{
      d=d==='dark'?'light':'dark';
      r.setAttribute('data-theme',d);
      t.setAttribute('aria-label','Switch to '+(d==='dark'?'light':'dark')+' mode');
      t.innerHTML=d==='dark'
        ?'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>'
        :'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';
    });
  }
})();

// ── INIT ─────────────────────────────────────────────────────
renderAll();
</script>
</body>
</html>
